<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>Receipt Scanner</title>
  <style>
    /* Layout: one narrow column — scan card, review panel (after a scan), then the item list. */
    :root {
      --bg: #f3f4f2;
      --paper: #ffffff;
      --ink: #1c1f1d;
      --muted: #6b716d;
      --line: #d5d9d6;
      --accent: #1f7a5a;
      --accent-ink: #ffffff;
      --warn-bg: #fff4dc;
      --warn-ink: #7a5300;
      --danger: #c0392b;
      --mono: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      --sans: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    @media (prefers-color-scheme: dark) {
      :root:not([data-theme="light"]) {
        color-scheme: dark;
        --bg: #161917; --paper: #212522; --ink: #eef1ee; --muted: #a1a8a3; --line: #363c38;
        --accent: #4cc392; --accent-ink: #0d1f17; --warn-bg: #3a2f14; --warn-ink: #f3cf7a; --danger: #f1867a;
      }
    }
    :root[data-theme="dark"] {
      color-scheme: dark;
      --bg: #161917; --paper: #212522; --ink: #eef1ee; --muted: #a1a8a3; --line: #363c38;
      --accent: #4cc392; --accent-ink: #0d1f17; --warn-bg: #3a2f14; --warn-ink: #f3cf7a; --danger: #f1867a;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding-block: 24px;
      padding-inline: 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: var(--sans);
      font-size: 15px;
    }
    main { max-width: 560px; margin: 0 auto; display: flex; flex-direction: column; gap: 20px; }
    h1 { font-size: 1.4rem; margin: 0; text-wrap: balance; }
    h2 { font-size: 1rem; margin: 0; }
    p { margin: 0; }
    .muted { color: var(--muted); font-size: 0.85rem; }
    .card { background: var(--paper); border: 1px solid var(--line); border-radius: 8px; padding: 16px; display: flex; flex-direction: column; gap: 12px; min-width: 0; }
    .row { display: flex; gap: 8px; flex-wrap: wrap; align-items: center; }
    input, button { font: inherit; color: var(--ink); }
    input[type="text"], input[type="number"] {
      padding: 7px 8px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); width: 100%; min-width: 0;
    }
    button {
      padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; background: var(--paper); cursor: pointer;
    }
    button:disabled { opacity: 0.5; cursor: not-allowed; }
    button.primary, label.primary { background: var(--accent); border-color: var(--accent); color: var(--accent-ink); }
    button:focus-visible, label.btn:focus-within, input:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
    label.btn {
      display: inline-flex; align-items: center; padding: 8px 12px; border: 1px solid var(--line); border-radius: 6px; cursor: pointer;
      background: var(--paper);
    }
    label.btn input { position: absolute; width: 1px; height: 1px; opacity: 0; }
    .preview { max-width: 100%; max-height: 220px; border-radius: 6px; border: 1px solid var(--line); align-self: flex-start; }
    .status { font-size: 0.9rem; }
    .status.error { color: var(--danger); }

    .review-item { display: grid; grid-template-columns: auto 1fr 64px 84px; gap: 8px; align-items: center; }
    .review-item.dup { grid-template-columns: 1fr; background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 10px; gap: 8px; }
    .dup .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .dup .actions button.chosen { background: var(--warn-ink); color: var(--warn-bg); border-color: var(--warn-ink); }
    .colhead { display: grid; grid-template-columns: auto 1fr 64px 84px; gap: 8px; font-size: 0.75rem; color: var(--muted); }
    .colhead span:first-child { width: 16px; }

    .confirm { background: var(--warn-bg); color: var(--warn-ink); border-radius: 6px; padding: 10px; display: flex; flex-direction: column; gap: 8px; }

    .add-form { display: grid; grid-template-columns: 1fr 64px 84px auto; gap: 8px; }
    table { width: 100%; border-collapse: collapse; font-variant-numeric: tabular-nums; }
    th, td { padding: 6px 0; text-align: left; border-bottom: 1px dashed var(--line); vertical-align: top; }
    th { font-weight: normal; color: var(--muted); font-size: 0.8rem; }
    td.num, th.num { text-align: right; padding-left: 8px; }
    td.x { width: 28px; text-align: right; }
    .remove { border: none; background: none; color: var(--danger); padding: 0 4px; }
    .empty { text-align: center; color: var(--muted); padding: 16px 0; }
    .total { display: flex; justify-content: space-between; font-weight: 600; font-variant-numeric: tabular-nums; }
    @media (max-width: 420px) {
      .add-form { grid-template-columns: 1fr 64px 84px; }
      .add-form button { grid-column: 1 / -1; }
    }
  </style>
</head>
<body>
  <main>
    <header>
      <h1>Receipt Scanner</h1>
      <p class="muted">Take a photo of a receipt. Items are read from it and added to your list. Items already on the list are never added twice.</p>
    </header>

    <section class="card" aria-labelledby="scan-h">
      <h2 id="scan-h">Scan a receipt</h2>
      <div class="row">
        <label class="btn primary">Take photo
          <input id="photo-camera" type="file" accept="image/*" capture="environment">
        </label>
        <label class="btn">Upload image
          <input id="photo-upload" type="file" accept="image/*">
        </label>
      </div>
      <img id="preview" class="preview" alt="Receipt photo" hidden>
      <p id="scan-status" class="status" role="status" hidden></p>
    </section>

    <section id="review" class="card" aria-labelledby="review-h" hidden>
      <h2 id="review-h">Items found on the receipt</h2>
      <div id="review-new"></div>
      <div id="review-dups"></div>
      <div class="row">
        <button type="button" id="review-add" class="primary">Add to list</button>
        <button type="button" id="review-cancel">Discard scan</button>
      </div>
    </section>

    <section class="card" aria-labelledby="list-h">
      <div class="row" style="justify-content: space-between;">
        <h2 id="list-h">My items</h2>
        <button type="button" id="clear-btn">Clear list</button>
      </div>
      <div id="clear-confirm" class="confirm" hidden>
        <p>Remove every item from your list?</p>
        <div class="row">
          <button type="button" id="clear-yes">Yes, clear it</button>
          <button type="button" id="clear-no">Keep items</button>
        </div>
      </div>
      <form id="add-form" class="add-form" autocomplete="off">
        <input id="add-name" type="text" placeholder="Add item manually" aria-label="Item name" required>
        <input id="add-qty" type="number" min="1" step="1" value="1" aria-label="Quantity" required>
        <input id="add-price" type="number" min="0" step="0.01" placeholder="Price" aria-label="Unit price">
        <button type="submit">Add</button>
      </form>
      <div id="add-confirm" class="confirm" hidden></div>
      <table>
        <thead><tr><th>Item</th><th class="num">Qty</th><th class="num">Price</th><th class="num">Amount</th><th></th></tr></thead>
        <tbody id="list-body"></tbody>
      </table>
      <div class="total"><span>Total</span><span id="list-total">0.00</span></div>
    </section>
  </main>

  <script>
    const $ = (id) => document.getElementById(id);
    const money = (n) => (Number(n) || 0).toFixed(2);
    const keyOf = (name) => String(name).toLowerCase().replace(/[^a-z0-9]+/g, ' ').trim();

    // ---------- Persistence: per-viewer db when hosted as a Claude artifact, else localStorage ----------
    const LS_KEY = 'receipt-scanner-items';
    let items = [];
    let dbDoc = null;

    function loadLocal() {
      try { return JSON.parse(localStorage.getItem(LS_KEY)) || []; } catch { return []; }
    }
    function save() {
      renderList();
      if (dbDoc) {
        dbDoc.set({ items }).catch(() => setStatus('Could not save your list. Changes may be lost on reload.', true));
      } else {
        try { localStorage.setItem(LS_KEY, JSON.stringify(items)); } catch { /* storage unavailable */ }
      }
    }
    async function initDb() {
      if (!window.claude?.use) return;
      const [db, user] = await Promise.all([window.claude.use('db'), window.claude.use('user')]);
      const uid = user ? await user.id() : null;
      if (!db || !uid) return;
      dbDoc = db.collection('data/users/' + uid).doc('list');
      try {
        const snap = await dbDoc.get();
        const stored = snap.data()?.items;
        if (Array.isArray(stored)) { items = stored; renderList(); }
        else if (items.length) await dbDoc.set({ items });
      } catch { dbDoc = null; }
    }

    // ---------- List ----------
    function findItem(name) {
      const k = keyOf(name);
      return items.find((it) => keyOf(it.name) === k);
    }
    function renderList() {
      const body = $('list-body');
      body.replaceChildren();
      if (!items.length) {
        const td = body.insertRow().insertCell();
        td.colSpan = 5; td.className = 'empty';
        td.textContent = 'No items yet. Scan a receipt or add one above.';
      }
      items.forEach((it, i) => {
        const r = body.insertRow();
        r.insertCell().textContent = it.name;
        [it.qty, money(it.price), money(it.qty * it.price)].forEach((v) => {
          const c = r.insertCell(); c.className = 'num'; c.textContent = v;
        });
        const x = r.insertCell(); x.className = 'x';
        const b = document.createElement('button');
        b.type = 'button'; b.className = 'remove'; b.textContent = '✕';
        b.setAttribute('aria-label', 'Remove ' + it.name);
        b.onclick = () => { items.splice(i, 1); save(); };
        x.append(b);
      });
      $('list-total').textContent = money(items.reduce((s, it) => s + it.qty * it.price, 0));
    }

    // Manual add, with confirmation when the item already exists
    $('add-form').addEventListener('submit', (e) => {
      e.preventDefault();
      const name = $('add-name').value.trim();
      const qty = Math.max(1, parseInt($('add-qty').value, 10) || 1);
      const price = Math.max(0, parseFloat($('add-price').value) || 0);
      if (!name) return;
      const existing = findItem(name);
      const reset = () => { $('add-form').reset(); $('add-qty').value = 1; $('add-confirm').hidden = true; $('add-name').focus(); };
      if (!existing) { items.push({ name, qty, price }); save(); reset(); return; }
      const box = $('add-confirm');
      box.replaceChildren();
      const p = document.createElement('p');
      p.textContent = `"${existing.name}" is already on your list. Ignore this one?`;
      const row = document.createElement('div'); row.className = 'row';
      const ignore = document.createElement('button');
      ignore.type = 'button'; ignore.textContent = 'Yes, ignore it';
      ignore.onclick = reset;
      const merge = document.createElement('button');
      merge.type = 'button'; merge.textContent = `No, add ${qty} to existing quantity`;
      merge.onclick = () => { existing.qty += qty; save(); reset(); };
      row.append(ignore, merge);
      box.append(p, row);
      box.hidden = false;
    });

    $('clear-btn').onclick = () => { $('clear-confirm').hidden = !items.length; };
    $('clear-no').onclick = () => { $('clear-confirm').hidden = true; };
    $('clear-yes').onclick = () => { items = []; save(); $('clear-confirm').hidden = true; };

    // ---------- Scanning ----------
    function setStatus(msg, isError) {
      const s = $('scan-status');
      s.hidden = !msg; s.textContent = msg || ''; s.classList.toggle('error', !!isError);
    }

    const PROMPT = 'This image is a photo of a shopping receipt. Extract every purchased line item. ' +
      'Reply with only a JSON array of objects: {"name": string, "qty": number, "price": number}. ' +
      '"name" is the product name written in plain readable words (expand obvious abbreviations), ' +
      '"qty" is the quantity bought (1 if not shown), "price" is the price of ONE unit. ' +
      'Leave out subtotal, tax, total, discounts, coupons, payment, change and store information. ' +
      'If the image is not a receipt or no items are readable, reply with []. ' +
      'Example: [{"name": "Whole Milk 1 gal", "qty": 2, "price": 3.49}]';

    async function extractWithClaude(file) {
      const sample = window.claude?.use ? await window.claude.use('sample') : null;
      if (!sample) return null;
      const limits = await sample.limits().catch(() => null);
      if (!limits?.images) return null;
      const result = await sample.json(PROMPT, { images: file });
      if (!Array.isArray(result)) throw { code: 'invalid_json' };
      return result;
    }

    // Fallback when not running inside Claude: on-device OCR with Tesseract.js plus line parsing
    function loadTesseract() {
      if (window.Tesseract) return Promise.resolve(window.Tesseract);
      return new Promise((resolve, reject) => {
        const s = document.createElement('script');
        s.src = 'https://cdn.jsdelivr.net/npm/tesseract.js@5.1.1/dist/tesseract.min.js';
        s.onload = () => resolve(window.Tesseract);
        s.onerror = () => reject(new Error('Could not load the text reader.'));
        document.head.append(s);
      });
    }
    const SKIP = /\b(sub\s*-?total|total|tax|vat|change|cash|visa|master\s*card|amex|debit|credit|balance|tender|card|payment|paid|savings?|discount|coupon|due|tip|auth|approval|ref|tel|phone)\b/i;
    function parseReceiptText(text) {
      const out = [];
      for (const raw of text.split('\n')) {
        const line = raw.replace(/\s+/g, ' ').trim();
        if (!line || SKIP.test(line)) continue;
        const m = line.match(/^(?:(\d{1,2})\s*[x@]?\s+)?(.*?[A-Za-z]{2}.*?)\s+\$?(\d{1,5}[.,]\d{2})\s*[A-Za-z*]{0,2}$/);
        if (!m) continue;
        const qty = Math.max(1, parseInt(m[1], 10) || 1);
        const lineTotal = parseFloat(m[3].replace(',', '.'));
        const name = m[2].replace(/\b\d{5,}\b/g, '').replace(/[^\w&%'./ -]/g, '').replace(/\s+/g, ' ').trim();
        if (name.length < 2) continue;
        out.push({ name, qty, price: Math.round((lineTotal / qty) * 100) / 100 });
      }
      return out;
    }
    async function extractWithOcr(file) {
      const T = await loadTesseract();
      const { data } = await T.recognize(file, 'eng', {
        logger: (m) => { if (m.status === 'recognizing text') setStatus(`Reading receipt… ${Math.round(m.progress * 100)}%`); },
      });
      return parseReceiptText(data.text || '');
    }

    const ERRORS = {
      not_granted: 'Reading receipts needs permission to use Claude. Reload the page to be asked again.',
      rate_limited: 'Too many scans in a short time. Wait a minute and try again.',
      image_rejected: 'That image could not be read. Try a JPEG or PNG photo.',
      invalid_json: 'The receipt could not be read clearly. Try a sharper, well-lit photo.',
      session_expired: 'Your Claude session expired. Sign in again and retry.',
    };

    async function handleFile(file) {
      if (!file) return;
      const prev = $('preview');
      if (prev.src) URL.revokeObjectURL(prev.src);
      prev.src = URL.createObjectURL(file); prev.hidden = false;
      $('review').hidden = true;
      setStatus('Reading receipt…');
      try {
        let found = null;
        try { found = await extractWithClaude(file); }
        catch (e) { if (e?.code !== 'not_granted' && e?.code !== 'images_unavailable') throw e; }
        if (!found) found = await extractWithOcr(file);
        const cleaned = found
          .map((it) => ({
            name: String(it?.name ?? '').trim(),
            qty: Math.max(1, Math.round(Number(it?.qty)) || 1),
            price: Math.max(0, Number(it?.price) || 0),
          }))
          .filter((it) => it.name);
        if (!cleaned.length) { setStatus('No items were found on that receipt. Try a clearer photo.', true); return; }
        setStatus(`Found ${cleaned.length} item${cleaned.length === 1 ? '' : 's'}. Review them below.`);
        openReview(cleaned);
      } catch (e) {
        setStatus(ERRORS[e?.code] || e?.message || 'Something went wrong reading the receipt. Try again.', true);
      }
    }
    ['photo-camera', 'photo-upload'].forEach((id) => {
      $(id).addEventListener('change', (e) => { handleFile(e.target.files[0]); e.target.value = ''; });
    });

    // ---------- Review: new items are pre-selected; every duplicate needs an explicit decision ----------
    let pending = [];
    function openReview(found) {
      pending = found.map((it) => ({ ...it, include: true, decision: null }));
      renderReview();
      $('review').hidden = false;
      $('review').scrollIntoView({ behavior: 'smooth', block: 'start' });
    }
    function classify() {
      const seen = new Set();
      for (const p of pending) {
        const k = keyOf(p.name);
        p.dup = findItem(p.name) ? 'list' : seen.has(k) ? 'receipt' : null;
        if (!p.dup) p.decision = null;
        seen.add(k);
      }
    }
    function renderReview() {
      classify();
      const fresh = pending.filter((p) => !p.dup);
      const dups = pending.filter((p) => p.dup);
      const newBox = $('review-new'); const dupBox = $('review-dups');
      newBox.replaceChildren(); dupBox.replaceChildren();

      if (fresh.length) {
        const head = document.createElement('div'); head.className = 'colhead';
        head.innerHTML = '<span></span><span>New item</span><span>Qty</span><span>Price</span>';
        newBox.append(head);
        const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:6px;margin-top:6px';
        fresh.forEach((p) => {
          const row = document.createElement('div'); row.className = 'review-item';
          const cb = document.createElement('input'); cb.type = 'checkbox'; cb.checked = p.include;
          cb.setAttribute('aria-label', 'Include ' + p.name);
          cb.onchange = () => { p.include = cb.checked; updateAddButton(); };
          const name = document.createElement('input'); name.type = 'text'; name.value = p.name; name.setAttribute('aria-label', 'Item name');
          name.onchange = () => { p.name = name.value.trim() || p.name; renderReview(); };
          const qty = document.createElement('input'); qty.type = 'number'; qty.min = 1; qty.step = 1; qty.value = p.qty; qty.setAttribute('aria-label', 'Quantity');
          qty.onchange = () => { p.qty = Math.max(1, parseInt(qty.value, 10) || 1); };
          const price = document.createElement('input'); price.type = 'number'; price.min = 0; price.step = 0.01; price.value = money(p.price); price.setAttribute('aria-label', 'Unit price');
          price.onchange = () => { p.price = Math.max(0, parseFloat(price.value) || 0); };
          row.append(cb, name, qty, price);
          wrap.append(row);
        });
        newBox.append(wrap);
      }

      if (dups.length) {
        const h = document.createElement('p'); h.className = 'muted'; h.style.margin = '12px 0 6px';
        h.textContent = `${dups.length} duplicate${dups.length === 1 ? '' : 's'}: confirm what to do with each before adding.`;
        dupBox.append(h);
        const wrap = document.createElement('div'); wrap.style.cssText = 'display:flex;flex-direction:column;gap:8px';
        dups.forEach((p) => {
          const row = document.createElement('div'); row.className = 'review-item dup';
          const msg = document.createElement('p');
          msg.textContent = p.dup === 'list'
            ? `"${p.name}" (qty ${p.qty}, ${money(p.price)}) is already on your list. Ignore it?`
            : `"${p.name}" (qty ${p.qty}) appears more than once on this receipt. Ignore this line?`;
          const actions = document.createElement('div'); actions.className = 'actions';
          const ignore = document.createElement('button'); ignore.type = 'button'; ignore.textContent = 'Yes, ignore';
          const merge = document.createElement('button'); merge.type = 'button'; merge.textContent = `No, add ${p.qty} to its quantity`;
          ignore.classList.toggle('chosen', p.decision === 'ignore');
          merge.classList.toggle('chosen', p.decision === 'merge');
          ignore.setAttribute('aria-pressed', p.decision === 'ignore');
          merge.setAttribute('aria-pressed', p.decision === 'merge');
          ignore.onclick = () => { p.decision = 'ignore'; renderReview(); };
          merge.onclick = () => { p.decision = 'merge'; renderReview(); };
          actions.append(ignore, merge);
          row.append(msg, actions);
          wrap.append(row);
        });
        if (dups.length > 1) {
          const all = document.createElement('button'); all.type = 'button'; all.textContent = 'Ignore all duplicates';
          all.style.alignSelf = 'flex-start';
          all.onclick = () => { dups.forEach((p) => { p.decision = 'ignore'; }); renderReview(); };
          wrap.append(all);
        }
        dupBox.append(wrap);
      }
      updateAddButton();
    }
    function updateAddButton() {
      const unresolved = pending.filter((p) => p.dup && !p.decision).length;
      const btn = $('review-add');
      btn.disabled = unresolved > 0;
      btn.textContent = unresolved ? `Confirm ${unresolved} duplicate${unresolved === 1 ? '' : 's'} first` : 'Add to list';
    }
    $('review-add').onclick = () => {
      let added = 0, merged = 0, ignored = 0;
      for (const p of pending) {
        if (p.decision === 'ignore' || (!p.dup && !p.include)) { ignored += p.decision === 'ignore' ? 1 : 0; continue; }
        const existing = findItem(p.name);
        if (existing) { existing.qty += p.qty; merged++; }
        else { items.push({ name: p.name, qty: p.qty, price: p.price }); added++; }
      }
      save();
      pending = [];
      $('review').hidden = true;
      setStatus(`Added ${added} new item${added === 1 ? '' : 's'}` +
        (merged ? `, updated quantity on ${merged}` : '') + (ignored ? `, ignored ${ignored} duplicate${ignored === 1 ? '' : 's'}` : '') + '.');
    };
    $('review-cancel').onclick = () => { pending = []; $('review').hidden = true; setStatus(''); };

    items = loadLocal();
    renderList();
    initDb();
  </script>
</body>
</html>
