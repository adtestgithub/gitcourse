<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Receipt Builder</title>
  <style>
    :root {
      --bg: #f4f4f5;
      --paper: #ffffff;
      --ink: #18181b;
      --muted: #71717a;
      --line: #d4d4d8;
      --accent: #2563eb;
      --danger: #dc2626;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --bg: #18181b;
        --paper: #27272a;
        --ink: #f4f4f5;
        --muted: #a1a1aa;
        --line: #3f3f46;
        --accent: #60a5fa;
        --danger: #f87171;
      }
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      padding: 24px 16px;
      background: var(--bg);
      color: var(--ink);
      font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    }
    main { max-width: 480px; margin: 0 auto; }
    h1 { font-size: 1.4rem; margin: 0 0 16px; }
    form {
      display: grid;
      grid-template-columns: 1fr 70px 90px;
      gap: 8px;
      margin-bottom: 8px;
    }
    form button { grid-column: 1 / -1; }
    label { display: flex; flex-direction: column; font-size: 0.75rem; color: var(--muted); gap: 4px; }
    input, button {
      font: inherit;
      padding: 8px;
      border: 1px solid var(--line);
      border-radius: 6px;
      background: var(--paper);
      color: var(--ink);
      width: 100%;
    }
    button { cursor: pointer; }
    button.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
    .tax-row { display: flex; align-items: center; gap: 8px; margin-bottom: 16px; font-size: 0.9rem; }
    .tax-row input { width: 80px; }
    .receipt {
      background: var(--paper);
      border: 1px dashed var(--line);
      border-radius: 4px;
      padding: 20px;
      font-family: ui-monospace, "SFMono-Regular", Menlo, Consolas, monospace;
      font-size: 0.9rem;
    }
    .receipt h2 { text-align: center; font-size: 1rem; margin: 0 0 4px; letter-spacing: 0.1em; }
    .receipt .date { text-align: center; color: var(--muted); font-size: 0.8rem; margin-bottom: 12px; }
    table { width: 100%; border-collapse: collapse; }
    th, td { padding: 4px 0; text-align: left; vertical-align: top; }
    th { font-weight: normal; color: var(--muted); border-bottom: 1px dashed var(--line); }
    td.num, th.num { text-align: right; }
    td.actions { width: 24px; text-align: right; }
    .remove { border: none; background: none; color: var(--danger); padding: 0 0 0 6px; width: auto; }
    .empty { text-align: center; color: var(--muted); padding: 12px 0; }
    .totals { border-top: 1px dashed var(--line); margin-top: 8px; padding-top: 8px; }
    .totals div { display: flex; justify-content: space-between; padding: 2px 0; }
    .totals .grand { font-weight: bold; font-size: 1rem; border-top: 1px dashed var(--line); margin-top: 4px; padding-top: 6px; }
    .clear { margin-top: 12px; }
  </style>
</head>
<body>
  <main>
    <h1>Receipt Builder</h1>

    <form id="item-form" autocomplete="off">
      <label>Item
        <input id="item-name" type="text" required placeholder="e.g. Coffee">
      </label>
      <label>Qty
        <input id="item-qty" type="number" min="1" step="1" value="1" required>
      </label>
      <label>Price
        <input id="item-price" type="number" min="0" step="0.01" required placeholder="0.00">
      </label>
      <button type="submit" class="primary">Add to receipt</button>
    </form>

    <div class="tax-row">
      <label for="tax-rate" style="flex-direction:row;align-items:center;color:inherit;font-size:inherit">Tax rate (%)</label>
      <input id="tax-rate" type="number" min="0" step="0.01" value="0">
    </div>

    <section class="receipt" aria-live="polite">
      <h2>RECEIPT</h2>
      <div class="date" id="receipt-date"></div>
      <table>
        <thead>
          <tr><th>Item</th><th class="num">Qty</th><th class="num">Amount</th><th></th></tr>
        </thead>
        <tbody id="receipt-items"></tbody>
      </table>
      <div class="totals">
        <div><span>Subtotal</span><span id="subtotal">0.00</span></div>
        <div><span>Tax</span><span id="tax">0.00</span></div>
        <div class="grand"><span>Total</span><span id="total">0.00</span></div>
      </div>
    </section>

    <button type="button" class="clear" id="clear-btn">Clear receipt</button>
  </main>

  <script>
    const items = [];
    const form = document.getElementById('item-form');
    const nameInput = document.getElementById('item-name');
    const qtyInput = document.getElementById('item-qty');
    const priceInput = document.getElementById('item-price');
    const taxInput = document.getElementById('tax-rate');
    const tbody = document.getElementById('receipt-items');

    document.getElementById('receipt-date').textContent = new Date().toLocaleString();

    const money = (n) => n.toFixed(2);

    function render() {
      tbody.replaceChildren();
      if (items.length === 0) {
        const row = tbody.insertRow();
        const cell = row.insertCell();
        cell.colSpan = 4;
        cell.className = 'empty';
        cell.textContent = 'No items yet';
      }
      items.forEach((item, i) => {
        const row = tbody.insertRow();
        row.insertCell().textContent = item.name + ' @ ' + money(item.price);
        const qty = row.insertCell();
        qty.className = 'num';
        qty.textContent = item.qty;
        const amount = row.insertCell();
        amount.className = 'num';
        amount.textContent = money(item.qty * item.price);
        const actions = row.insertCell();
        actions.className = 'actions';
        const btn = document.createElement('button');
        btn.className = 'remove';
        btn.type = 'button';
        btn.textContent = '✕';
        btn.setAttribute('aria-label', 'Remove ' + item.name);
        btn.addEventListener('click', () => { items.splice(i, 1); render(); });
        actions.appendChild(btn);
      });

      const subtotal = items.reduce((sum, it) => sum + it.qty * it.price, 0);
      const rate = Math.max(0, parseFloat(taxInput.value) || 0);
      const tax = subtotal * rate / 100;
      document.getElementById('subtotal').textContent = money(subtotal);
      document.getElementById('tax').textContent = money(tax);
      document.getElementById('total').textContent = money(subtotal + tax);
    }

    form.addEventListener('submit', (e) => {
      e.preventDefault();
      const name = nameInput.value.trim();
      const qty = parseInt(qtyInput.value, 10);
      const price = parseFloat(priceInput.value);
      if (!name || !(qty > 0) || !(price >= 0)) return;
      items.push({ name, qty, price });
      form.reset();
      qtyInput.value = 1;
      nameInput.focus();
      render();
    });

    taxInput.addEventListener('input', render);
    document.getElementById('clear-btn').addEventListener('click', () => { items.length = 0; render(); });

    render();
  </script>
</body>
</html>
